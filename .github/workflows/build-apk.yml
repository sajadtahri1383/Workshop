name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6 @capacitor/status-bar@6

      - name: Build web app
        run: npm run build

      - name: Configure Android
        run: |
          npx cap init "WorkshopInvoice" "com.workshop.invoicemanager" --web-dir dist
          npx cap add android
          sed -i 's/WorkshopInvoice/مدیریت فاکتور کارگاه/g' android/app/src/main/res/values/strings.xml
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: workshop-invoice-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
